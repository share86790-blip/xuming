name: Run M1 Nature-R

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-m1:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libcairo2-dev libfontconfig1-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev fonts-liberation2

      - name: Install R packages
        shell: Rscript {0}
        run: |
          install.packages(c(
            'readr','dplyr','ggplot2','patchwork','metafor','digest','svglite','ragg'
          ), repos='https://cloud.r-project.org')

      - name: Run M1 Nature-R analysis
        shell: Rscript {0}
        run: |
          source('R/step3c1_m1_rct_os_nature.R', encoding='UTF-8')

      - name: Show generated outputs
        run: |
          find outputs -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload M1 outputs
        uses: actions/upload-artifact@v4
        with:
          name: M1-Nature-R-outputs
          path: outputs/
          if-no-files-found: error
          retention-days: 30
